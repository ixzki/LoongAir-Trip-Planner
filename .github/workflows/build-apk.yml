name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号标签（例如 v1.8.1，留空则自动读取 app/build.gradle.kts 的 versionName）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, Lint & build Debug + R8 Release APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChangfeiXing-Debug-APK
          path: app/build/outputs/apk/debug/ChangfeiXing-*.apk
          if-no-files-found: error

      - name: Upload Release APK (R8 Minified)
        uses: actions/upload-artifact@v4
        with:
          name: ChangfeiXing-Release-APK
          path: app/build/outputs/apk/release/ChangfeiXing-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare Release Tag & Checksums
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG_NAME="v${VER}"
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          mkdir -p dist_release
          cp release_assets/ChangfeiXing-Release-APK/*.apk dist_release/
          cp release_assets/ChangfeiXing-Debug-APK/*.apk dist_release/
          (cd dist_release && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist_release

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "畅飞行 ${{ steps.meta.outputs.tag }}"
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist_release/*.apk
            dist_release/SHA256SUMS.txt
          draft: false
          prerelease: false
