name: Build & Verify Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, Lint & build Debug + R8 Release APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: loongair-trip-planner-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK (R8 Minified)
        uses: actions/upload-artifact@v4
        with:
          name: loongair-trip-planner-release
          path: app/build/outputs/apk/release/app-release.apk
