name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '正式发布时填写已有标签（如 v1.8.3），留空只验证构建'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build Debug and unsigned R8 APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease -PallowUnsignedRelease=true --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ChangfeiXing-Debug-APK
          path: app/build/outputs/apk/debug/*-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ChangfeiXing-Unsigned-R8-APK
          path: app/build/outputs/apk/release/*-release-unsigned.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and source revision
        id: meta
        env:
          INPUT_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]] ||
             [[ -n "$INPUT_TAG" && "$INPUT_TAG" != "$tag" ]]; then
            echo "::error::Release tag must match app version $tag"
            exit 1
          fi
          if [[ "$(git rev-parse --verify "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag $tag must exist and point to the checked-out commit"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      - name: Sign R8 release with the project keystore
        env:
          LOONGAIR_KEYSTORE_BASE64: ${{ secrets.LOONGAIR_KEYSTORE_BASE64 }}
          LOONGAIR_KEYSTORE_PASSWORD: ${{ secrets.LOONGAIR_KEYSTORE_PASSWORD }}
          LOONGAIR_KEY_ALIAS: ${{ secrets.LOONGAIR_KEY_ALIAS }}
          LOONGAIR_KEY_PASSWORD: ${{ secrets.LOONGAIR_KEY_PASSWORD }}
          LOONGAIR_RELEASE_CERT_SHA256: ${{ vars.LOONGAIR_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${LOONGAIR_KEYSTORE_BASE64:?Missing project signing keystore}"
          umask 077
          export LOONGAIR_KEYSTORE_PATH="$RUNNER_TEMP/loongair-release.keystore"
          trap 'rm -f -- "$LOONGAIR_KEYSTORE_PATH"' EXIT
          printf '%s' "$LOONGAIR_KEYSTORE_BASE64" | base64 --decode > "$LOONGAIR_KEYSTORE_PATH"
          unset LOONGAIR_KEYSTORE_BASE64
          ./gradlew --no-daemon assembleRelease --console=plain

      - name: Verify final APK certificate and manifest, then generate checksum
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PINNED_SHA256: ${{ vars.LOONGAIR_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/ChangfeiXing-v${RELEASE_VERSION}-release.apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/loongair-cert.txt"
          mapfile -t signers < <(sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([a-fA-F0-9]+)$/\1/p' "$RUNNER_TEMP/loongair-cert.txt")
          pin=$(printf '%s' "$PINNED_SHA256" | tr -d '[:space:]:')
          [[ "$pin" =~ ^[a-fA-F0-9]{64}$ && "${#signers[@]}" == 1 ]]
          [[ "${signers[0],,}" == "${pin,,}" ]] || { echo "::error::Unexpected APK signer"; exit 1; }
          package=$("$build_tools/aapt" dump badging "$apk" | sed -n '1p')
          [[ "$package" == *"name='com.loongair.tripplanner'"* && "$package" == *"versionName='$RELEASE_VERSION'"* ]] ||
            { echo "::error::APK manifest does not match the release tag or app ID"; exit 1; }
          mkdir -p dist_release
          cp "$apk" dist_release/
          (cd dist_release && sha256sum *.apk > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 畅飞行 ${{ steps.meta.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist_release/*-release.apk
            dist_release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
